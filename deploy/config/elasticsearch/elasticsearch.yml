cluster.name: "docker-cluster"
network.host: 0.0.0.0

# 单机/开发：磁盘较满时默认 90% 高水位会导致所有分片无法分配（集群 RED），Kibana 会一直卡在「尚未准备就绪」
# 生产环境应优先清理磁盘或扩容，而不是放宽水位
cluster.routing.allocation.disk.watermark.low: 92%
cluster.routing.allocation.disk.watermark.high: 97%
cluster.routing.allocation.disk.watermark.flood_stage: 99%

# ES 8+ 禁止在 elasticsearch.yml 中写 index.*（会直接导致进程退出、容器反复重启）。
# 单节点需要 0 副本时：启动后用 API 或索引模板设置，例如：
#   PUT _index_template/tiktok-logs { "index_patterns":["*"], "template":{"settings":{"number_of_replicas":0}} }
