global:
  scrape_interval:     15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: 'prometheus'
    static_configs:
    - targets: ['prometheus:9090']
  - job_name: 'cadvisor'
    static_configs:
    - targets: ['cadvisor:8080']
  - job_name: 'node'
    static_configs:
    - targets: ['node-exporter:9100']
  - job_name: 'redis_exporter'
    static_configs:
    - targets: ['redis-exporter:9121']
  - job_name: 'mysql_exporter'
    static_configs:
    - targets: ['mysql-exporter:9104']

  # Hertz API：GET /metrics。可同时配两个地址，不用的那个会在 Targets 里显示 DOWN，属正常。
  # - 宿主机跑 API（常见 8080）：host.docker.internal:8080
  # - 全栈 Docker（docker-compose.apps.yml 的 tiktok-api）：tiktok-api:10001（与 prometheus 同 tiktok 网络）
  - job_name: 'api'
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets:
          - 'host.docker.internal:8080'
          - 'tiktok-api:10001'

