# 在 Docker Compose 的 tiktok 网络内运行 api/user/product/order 时使用。
# 通过 docker-compose.apps.yml 挂载为 etcd 的 /config/config.yaml 并写入 etcd，
# 与宿主机直连（127.0.0.1:43306 等）的 config.yaml 区分开。

etcd-addr: etcd:2379

server:
  jwt-secret: MTAxNTkwMTg1Mw==
  version: "1.0"
  name: tiktok

snowflake:
  worker-id: 0
  datancenter-id: 0

mysql:
  addr: mysql:3306
  database: tiktok
  username: tiktok
  password: tiktok
  charset: utf8mb4

oss:
  endpoint:
  accessKey-id:
  accessKey-secret:
  bucketname:
  main-directory: tiktok

elasticsearch:
  addr: elasticsearch:9200
  host: elasticsearch

etcd:
  addr: etcd:2379

rabbitmq:
  addr: rabiitmq:5672
  username: tiktok
  password: tiktok

redis:
  addr: redis:6379
  password: tiktok

jaeger:
  addr: jaeger:6831

services:
  api:
    name: api
    load-balance: false
    addr:
      - tiktok-api:10001
  user:
    name: user
    load-balance: false
    addr:
      - tiktok-user:10002
  product:
    name: product
    load-balance: false
    addr:
      - tiktok-product:10003
  order:
    name: order
    load-balance: false
    addr:
      - tiktok-order:10004
  interaction:
    name: interaction
    load-balance: false
    addr:
      - 127.0.0.1:10005
  video:
    name: video
    load-balance: false
    addr:
      - 127.0.0.1:10006
